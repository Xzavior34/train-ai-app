<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're offline - Train AI</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F4F6FC; color: #10142A; padding: 24px; box-sizing: border-box;
  }
  .card {
    max-width: 420px; width: 100%; background: #fff; border: 1px solid #E6E9F5;
    border-radius: 20px; padding: 32px 28px; text-align: center;
    box-shadow: 0 20px 40px -16px rgba(16,20,42,.12);
  }
  .icon {
    width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 18px;
    background: linear-gradient(135deg, #2C46D6, #86A6FF);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px; font-weight: 800;
  }
  h1 { font-size: 19px; font-weight: 800; margin: 0 0 10px; }
  p { font-size: 13.5px; color: #656C86; line-height: 1.5; margin: 0 0 20px; }
  button {
    border: none; cursor: pointer; border-radius: 11px; font-weight: 700; font-size: 13.5px;
    padding: 11px 20px; color: #fff; background: linear-gradient(135deg, #2C46D6, #86A6FF);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <h1>You're offline</h1>
    <p>
      Train AI can't reach the network right now. Any pages and lessons you've
      already visited on this device may still be available - reconnect and
      try again to pick up where you left off.
    </p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
