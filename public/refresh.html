<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Refreshing Train AI</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #0f172a;
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 360px); text-align: center; }
      img { width: auto; height: 44px; margin-bottom: 24px; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #64748b; line-height: 1.6; }
      button {
        display: none;
        width: 100%;
        margin-top: 22px;
        padding: 12px 18px;
        border: 0;
        border-radius: 10px;
        color: white;
        background: #2563eb;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/train-ai-logo.png" alt="Train AI" />
      <h1>Updating Train AI</h1>
      <p id="status">Removing the previous website version…</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      (function () {
        var status = document.getElementById("status");
        var retry = document.getElementById("retry");

        function goToCurrentSite() {
          var destination = new URL("/", window.location.origin);
          destination.searchParams.set("_recovered", String(Date.now()));
          window.location.replace(destination.toString());
        }

        function recover() {
          retry.style.display = "none";
          status.textContent = "Removing the previous website version…";
          var jobs = [];

          if ("serviceWorker" in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.map(function (registration) {
                  return registration.unregister();
                }));
              })
            );
          }

          if ("caches" in window) {
            jobs.push(
              caches.keys().then(function (names) {
                return Promise.all(names.map(function (name) { return caches.delete(name); }));
              })
            );
          }

          Promise.all(jobs).then(function () {
            status.textContent = "Update complete. Opening the latest website…";
            goToCurrentSite();
          }).catch(function () {
            status.textContent = "The automatic update could not finish. Check your connection and try again.";
            retry.style.display = "block";
          });
        }

        retry.addEventListener("click", recover);
        recover();
      })();
    </script>
  </body>
</html>
