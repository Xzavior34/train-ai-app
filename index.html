<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="keywords" content="Train AI, LMS, learning management system, AI coaching, courses, cohorts, workforce intelligence, online learning, enterprise training" />

    <!-- Brand Color & System Scheme -->
    <meta name="theme-color" content="#2563EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0E1A" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trainai.app/" />
    <meta property="og:title" content="Train AI - The AI Learning Infrastructure for Organisations" />
    <meta property="og:description" content="Multi-tenant learning management system for organisations: structured courses, cohorts, analytics, AI coaching, and mentor support." />
    <meta property="og:image" content="https://trainai.app/logo.png" />
    <meta property="og:site_name" content="Train AI" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://trainai.app/" />
    <meta name="twitter:title" content="Train AI - The AI Learning Infrastructure for Organisations" />
    <meta name="twitter:description" content="Multi-tenant learning management system with AI coaching, structured courses, and cohort analytics." />
    <meta name="twitter:image" content="https://trainai.app/logo.png" />

    <!-- iOS / Apple Store Web App Metadata -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Train AI" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />

    <!-- Android / Google Play Store PWA Metadata -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Train AI" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Typography Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Cache Prevention Meta Tags for App Shell -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- JSON-LD Structured Data Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Train AI",
      "url": "https://trainai.app/",
      "description": "Multi-tenant AI-powered learning management infrastructure for organisations.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0"
      },
      "author": {
        "@type": "Organization",
        "name": "Train AI Ltd",
        "url": "https://trainai.app/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="tai-initial-loader" style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F8FAFC; color: #64748B; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px; box-sizing: border-box;">
        <img src="/train-ai-logo.png" alt="Train AI" style="height: 44px; width: auto; object-fit: contain; margin-bottom: 24px;" />
        <div style="width: 140px; height: 4px; border-radius: 99px; background: #E2E8F0; overflow: hidden; position: relative; margin-bottom: 16px;">
          <div style="position: absolute; top: 0; left: 0; width: 60%; height: 100%; background: #2563EB; border-radius: 99px;"></div>
        </div>
        <div id="tai-slow-load-helper" style="display: none; margin-top: 16px; animation: fadeIn 0.4s ease;">
          <p style="font-size: 13px; color: #64748B; margin: 0 0 12px;">Taking longer than expected?</p>
          <button onclick="window.__trainai_clear_cache_and_reload(true)" style="background: #2563EB; color: #FFFFFF; border: none; padding: 8px 16px; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(37,99,235,0.3);">
            Clear Cache &amp; Refresh
          </button>
        </div>
      </div>
    </div>
    <script>
      // Global Cache Clear & Auto-Recovery Utility
      window.__trainai_clear_cache_and_reload = function(forceHard) {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var r of registrations) {
                r.unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var n of names) {
                caches.delete(n);
              }
            });
          }
          if (forceHard) {
            try {
              sessionStorage.clear();
            } catch (e) {}
          }
        } catch (err) {
          console.error('Cache clearing error:', err);
        }
        var cleanUrl = window.location.pathname + (window.location.search ? window.location.search + '&' : '?') + '_nocache=' + Date.now();
        window.location.replace(cleanUrl);
      };

      // Show recovery button if initial React mount takes more than 4.5 seconds
      setTimeout(function() {
        var helper = document.getElementById('tai-slow-load-helper');
        if (helper && document.getElementById('tai-initial-loader')) {
          helper.style.display = 'block';
        }
      }, 4500);

      // Detect chunk loading errors, MIME errors, and dynamic import failures to auto-recover immediately
      function handleChunkOrCacheError(errorText) {
        var text = String(errorText || '').toLowerCase();
        var isChunkOrCacheIssue =
          text.indexOf('failed to fetch dynamically imported module') !== -1 ||
          text.indexOf('loading chunk') !== -1 ||
          text.indexOf('unexpected token \'<\'') !== -1 ||
          text.indexOf('mime type') !== -1 ||
          text.indexOf('importing a module script failed') !== -1;

        if (isChunkOrCacheIssue) {
          var lastReload = sessionStorage.getItem('trainai_auto_reload_ts');
          var now = Date.now();
          if (!lastReload || (now - parseInt(lastReload, 10)) > 20000) {
            sessionStorage.setItem('trainai_auto_reload_ts', String(now));
            console.warn('Chunk or cache mismatch detected. Auto-clearing cache and refreshing...');
            window.__trainai_clear_cache_and_reload(false);
            return true;
          }
        }
        return false;
      }

      window.addEventListener('error', function(e) {
        console.error('Global Error caught:', e);
        var msg = (e.message || e.error || '');
        if (handleChunkOrCacheError(msg)) return;

        var errDiv = document.getElementById('debug-error-overlay');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error-overlay';
          errDiv.style = 'position:fixed;bottom:10px;left:10px;right:10px;background:#7F1D1D;color:#FECACA;padding:16px;border-radius:8px;font-family:monospace;font-size:13px;z-index:999999;box-shadow:0 10px 25px rgba(0,0,0,0.5);white-space:pre-wrap;max-height:40vh;overflow:auto;';
          document.body.appendChild(errDiv);
        }
        errDiv.textContent = 'Runtime Error: ' + (e.message || e.error || e) + '\nSource: ' + (e.filename || '') + ':' + (e.lineno || '');
      });

      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled Rejection:', e);
        var reason = e.reason ? (e.reason.message || e.reason) : '';
        handleChunkOrCacheError(reason);
      });

      // Service Worker registration with auto-update
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var r of registrations) {
              r.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var n of names) {
                caches.delete(n);
              }
            });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              // Check for updates to prevent stale service workers
              if (reg && typeof reg.update === 'function') {
                reg.update();
              }
            }).catch(function(err) {
              console.log('SW registration failed:', err);
            });
          });
        }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
