  <body>
    <div id="root">
      <div style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F8FAFC; color: #64748B; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">

        </div>
      </div>
    </div>
    <script>
      function recoverFromStaleCache() {
        var key = 'tai_cache_reload_' + (new Date()).toDateString();
        var count = parseInt(sessionStorage.getItem(key) || '0', 10);
        if (count < 2) {
          sessionStorage.setItem(key, String(count + 1));
          if ('caches' in window) {
            caches.keys().then(function(names) {
              return Promise.all(names.map(function(n) { return caches.delete(n); }));
            }).finally(function() {
              window.location.reload(true);
            });
          } else {
            window.location.reload(true);
          }
        }
      }

      window.addEventListener('vite:preloadError', function(event) {
        console.warn('Vite preload chunk error, recovering...', event);
        recoverFromStaleCache();
      });

      window.addEventListener('error', function(e) {
        var msg = (e.message || (e.error && e.error.message) || '').toLowerCase();
        if (
          msg.includes('dynamically imported module') ||
          msg.includes('unexpected token \'<\'') ||
          msg.includes('loading chunk')
        ) {
          recoverFromStaleCache();
          return;
        }
        console.error('Global Error caught:', e);
      });

      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e.reason && (e.reason.message || e.reason)) ? String(e.reason.message || e.reason).toLowerCase() : '';
        if (
          reason.includes('dynamically imported module') ||
          reason.includes('unexpected token \'<\'') ||
          reason.includes('loading chunk')
        ) {
          recoverFromStaleCache();
          return;
        }
        console.error('Unhandled Rejection:', e);
      });

      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var r of registrations) {
              r.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var n of names) {
                caches.delete(n);
              }
            });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
              .then(function(reg) {
                reg.update().catch(function() {});
                reg.addEventListener('updatefound', function() {
                  var installingWorker = reg.installing;
                  if (installingWorker) {
                    installingWorker.addEventListener('statechange', function() {
                      if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        installingWorker.postMessage({ type: 'SKIP_WAITING' });
                      }
                    });
                  }
                });
              })
              .catch(function(err) {
                console.log('SW registration failed:', err);
              });

            var refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function() {
              if (!refreshing) {
                refreshing = true;
                window.location.reload();
              }
            });
          });
        }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
