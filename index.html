<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light" />
    <!-- iOS: run full-screen when added to home screen / wrapped by Capacitor -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Train AI" />
    <!-- Android: run full-screen when added to home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/train-ai-favicon.png" />
    <link rel="apple-touch-icon" href="/train-ai-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Train AI - The AI Learning Infrastructure for Organisations</title>
    <meta name="description" content="Train AI is a multi-tenant learning management system for organisations: structure courses, manage cohorts, see analytics, and give learners AI coaching and mentor support." />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F8FAFC; color: #64748B; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
        <img src="/train-ai-logo.png" alt="Train AI" style="height: 44px; width: auto; object-fit: contain; margin-bottom: 24px;" />
        <div style="width: 140px; height: 4px; border-radius: 99px; background: #E2E8F0; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; left: 0; width: 60%; height: 100%; background: #2563EB; border-radius: 99px;"></div>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global Error caught:', e);
        var errDiv = document.getElementById('debug-error-overlay');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error-overlay';
          errDiv.style = 'position:fixed;bottom:10px;left:10px;right:10px;background:#7F1D1D;color:#FECACA;padding:16px;border-radius:8px;font-family:monospace;font-size:13px;z-index:999999;box-shadow:0 10px 25px rgba(0,0,0,0.5);white-space:pre-wrap;max-height:40vh;overflow:auto;';
          document.body.appendChild(errDiv);
        }
        errDiv.textContent = 'Runtime Error: ' + (e.message || e.error || e) + '\nSource: ' + (e.filename || '') + ':' + (e.lineno || '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled Rejection:', e);
      });
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var r of registrations) {
              r.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var n of names) {
                caches.delete(n);
              }
            });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function(err) {
              console.log('SW registration failed:', err);
            });
          });
        }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
