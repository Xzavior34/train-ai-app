<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Train AI - AI Learning and Development for Organisations</title>

    <script>
      (function() {
        // 1. Safe storage shims in case mobile browser (Samsung Internet Secret Mode, iOS Safari Private) throws on storage
        try {
          var testKey = "__tai_test__";
          window.localStorage.setItem(testKey, testKey);
          window.localStorage.removeItem(testKey);
        } catch (e) {
          var memStore = {};
          try {
            Object.defineProperty(window, "localStorage", {
              value: {
                getItem: function(k) { return memStore[k] || null; },
                setItem: function(k, v) { memStore[k] = String(v); },
                removeItem: function(k) { delete memStore[k]; },
                clear: function() { memStore = {}; },
                key: function(i) { return Object.keys(memStore)[i] || null; },
                get length() { return Object.keys(memStore).length; }
              },
              writable: true,
              configurable: true
            });
          } catch (err) {}
        }

        try {
          var testSKey = "__tai_test_s__";
          window.sessionStorage.setItem(testSKey, testSKey);
          window.sessionStorage.removeItem(testSKey);
        } catch (e) {
          var memSStore = {};
          try {
            Object.defineProperty(window, "sessionStorage", {
              value: {
                getItem: function(k) { return memSStore[k] || null; },
                setItem: function(k, v) { memSStore[k] = String(v); },
                removeItem: function(k) { delete memSStore[k]; },
                clear: function() { memSStore = {}; },
                key: function(i) { return Object.keys(memSStore)[i] || null; },
                get length() { return Object.keys(memSStore).length; }
              },
              writable: true,
              configurable: true
            });
          } catch (err) {}
        }

        // Break mobile BFCache snapshots so returning to the app cannot restore
        // a document that references assets from an older deployment.
        window.addEventListener("pageshow", function(event) {
          if (event.persisted) {
            window.location.reload();
          }
        });

        var recoveryInProgress = false;

        function reloadWithFreshUrl() {
          var next;
          try {
            next = new URL(window.location.href);
            next.searchParams.set("_refresh", String(Date.now()));
            // Keep all existing parameters (invites, payments and org links).
            window.location.replace(next.toString());
          } catch (e) {
            window.location.reload();
          }
        }

        // One recovery implementation is shared by the initial loader, React's
        // loading screen and the error boundary. Crucially, reload only starts
        // after the worker and CacheStorage cleanup has completed.
        window.__trainai_clear_cache_and_reload = function() {
          if (recoveryInProgress) return Promise.resolve();
          recoveryInProgress = true;
          var jobs = [];

          if ("serviceWorker" in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations()
                .then(function(registrations) {
                  return Promise.all(registrations.map(function(registration) {
                    return registration.unregister();
                  }));
                })
                .catch(function() {})
            );
          }
          if ("caches" in window) {
            jobs.push(
              caches.keys()
                .then(function(names) {
                  return Promise.all(names.map(function(name) { return caches.delete(name); }));
                })
                .catch(function() {})
            );
          }

          return Promise.all(jobs).then(reloadWithFreshUrl, reloadWithFreshUrl);
        };
        // Backward-compatible name used by the pre-React loader in earlier builds.
        window.__tai_clear_cache_and_reload = window.__trainai_clear_cache_and_reload;

        function triggerHardRecovery() {
          var now = Date.now();
          var lastRecovery = 0;
          try { lastRecovery = parseInt(sessionStorage.getItem("tai_asset_recovery") || "0", 10); } catch (e) {}
          if (recoveryInProgress || (lastRecovery && now - lastRecovery < 60000)) return;
          try { sessionStorage.setItem("tai_asset_recovery", String(now)); } catch (e) {}
          window.__trainai_clear_cache_and_reload();
        }

        window.addEventListener("vite:preloadError", function(e) {
          console.warn("Vite preload error, recovering...", e);
          if (e && typeof e.preventDefault === "function") e.preventDefault();
          triggerHardRecovery();
        });

        window.addEventListener("error", function(e) {
          var msg = (e.message || (e.error && e.error.message) || "").toLowerCase();
          if (
            msg.indexOf("dynamically imported module") !== -1 ||
            msg.indexOf("unexpected token '<'") !== -1 ||
            msg.indexOf("loading chunk") !== -1 ||
            msg.indexOf("failed to fetch") !== -1 ||
            msg.indexOf("mime type") !== -1
          ) {
            triggerHardRecovery();
            return;
          }

          // Mobile error visibility fallback
          var loader = document.getElementById("tai-initial-loader");
          if (loader && !document.getElementById("tai-fatal-error-box")) {
            var box = document.createElement("div");
            box.id = "tai-fatal-error-box";
            box.style.cssText = "margin-top: 20px; padding: 14px 18px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 320px; text-align: left;";
            box.innerHTML = "<div style='font-size: 13px; font-weight: 700; color: #0F172A; margin-bottom: 4px;'>Train AI Notice</div><div style='font-size: 11.5px; color: #64748B; margin-bottom: 12px;'>A browser cache conflict was detected on this device.</div><button onclick='window.__tai_clear_cache_and_reload()' style='background: #2563EB; color: #FFFFFF; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%;'>Tap to Clear Cache & Refresh</button>";
            loader.appendChild(box);
          }
        });

        window.addEventListener("unhandledrejection", function(e) {
          var reason = (e.reason && (e.reason.message || e.reason)) ? String(e.reason.message || e.reason).toLowerCase() : "";
          if (
            reason.indexOf("dynamically imported module") !== -1 ||
            reason.indexOf("unexpected token '<'") !== -1 ||
            reason.indexOf("loading chunk") !== -1 ||
            reason.indexOf("failed to fetch") !== -1 ||
            reason.indexOf("mime type") !== -1
          ) {
            triggerHardRecovery();
          }
        });

        // Retire every legacy root worker. A root worker on trainailtd.com was
        // able to outlive deployments and keep serving an old or blank shell.
        // OneSignal is deliberately kept at its narrower /onesignal/ scope.
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then(function(registrations) {
              return Promise.all(registrations.map(function(registration) {
                var scopePath = "/";
                try { scopePath = new URL(registration.scope).pathname; } catch (e) {}
                return scopePath === "/" ? registration.unregister() : false;
              }));
            })
            .catch(function(error) { console.warn("Legacy worker cleanup failed", error); });
        }
      })();
    </script>

    <meta name="description" content="Train AI helps organisations deliver courses, manage cohorts and learning communities, support learners and instructors, and measure development outcomes in one platform." />

    <!-- Open Graph / Facebook -->

    <meta property="og:title" content="Train AI - AI Learning and Development for Organisations" />
    <meta property="og:description" content="Deliver courses, manage learning communities, support learners and instructors, and understand development outcomes in one platform." />
    <meta property="og:image" content="https://www.trainailtd.com/logo.png" />
    <meta property="og:site_name" content="Train AI" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.trainailtd.com/" />
    <meta name="twitter:title" content="Train AI - AI Learning and Development for Organisations" />
    <meta name="twitter:description" content="Deliver courses, manage learning communities, support learners and instructors, and understand development outcomes in one platform." />
    <meta name="twitter:image" content="https://www.trainailtd.com/logo.png" />

    <!-- iOS / Apple Store Web App Metadata -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Train AI" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />

    <!-- Android / Google Play Store PWA Metadata -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Train AI" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Typography Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- JSON-LD Structured Data Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Train AI",
      "url": "https://www.trainailtd.com/",
      "description": "An AI learning and development platform for delivering courses, managing learning communities, supporting learners and instructors, and measuring development outcomes.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All",
      "author": {
        "@type": "Organization",
        "name": "Train AI Ltd",
        "url": "https://www.trainailtd.com/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="tai-initial-loader" style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F8FAFC; color: #64748B; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;">
        <img src="/train-ai-logo.png" alt="Train AI" style="height: 44px; width: auto; object-fit: contain; margin-bottom: 24px;" />
        <div style="width: 140px; height: 4px; border-radius: 99px; background: #E2E8F0; overflow: hidden; position: relative; margin-bottom: 16px;">
          <div style="position: absolute; top: 0; left: 0; width: 60%; height: 100%; background: #2563EB; border-radius: 99px;"></div>
        </div>
        <div id="tai-slow-load-helper" style="display: none; margin-top: 16px;">
          <p style="font-size: 13.5px; color: #64748B; margin: 0 0 12px; font-weight: 500;">Taking longer than expected?</p>
          <button onclick="window.__tai_clear_cache_and_reload()" style="background: #2563EB; color: #FFFFFF; border: none; padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(37,99,235,0.25);">
            Tap to Refresh
          </button>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var helper = document.getElementById("tai-slow-load-helper");
        if (helper && document.getElementById("tai-initial-loader")) {
          helper.style.display = "block";
        }
      }, 3500);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
