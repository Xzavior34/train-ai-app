    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Train AI - The AI Learning Infrastructure for Organisations</title>

    <script>
      (function() {
        // 1. Safe storage shim in case iOS Safari Private Browsing throws on localStorage
        try {
          var testKey = "__tai_test__";
          window.localStorage.setItem(testKey, testKey);
          window.localStorage.removeItem(testKey);
        } catch (e) {
          var memStore = {};
          try {
            Object.defineProperty(window, "localStorage", {
              value: {
                getItem: function(k) { return memStore[k] || null; },
                setItem: function(k, v) { memStore[k] = String(v); },
                removeItem: function(k) { delete memStore[k]; },
                clear: function() { memStore = {}; },
                key: function(i) { return Object.keys(memStore)[i] || null; },
                get length() { return Object.keys(memStore).length; }
              },
              writable: true,
              configurable: true
            });
          } catch (err) {}
        }

        // 2. Break iOS Safari BFCache (Back-Forward Cache snapshot)
        window.addEventListener("pageshow", function(event) {
          if (event.persisted) {
            window.location.reload();
          }
        });

        // 3. Version enforcement & automatic fresh network fetch
        var APP_VER = "20261002_v9";
        var PREV_VER = "";
        try { PREV_VER = localStorage.getItem("tai_app_ver"); } catch(e) {}

        if (PREV_VER !== APP_VER) {
          try { localStorage.setItem("tai_app_ver", APP_VER); } catch(e) {}
          if ("caches" in window) {
            try {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              });
            } catch(e) {}
          }
          if ("serviceWorker" in navigator) {
            try {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.update(); });
              });
            } catch(e) {}
          }
          // If the visitor was holding an old cached page without the current version query param,
          // refresh once with a clean version param to force the browser HTTP cache to fetch new assets.
          if (!window.location.search.includes("_v=")) {
            var sep = window.location.search ? "&" : "?";
            window.location.replace(window.location.pathname + window.location.search + sep + "_v=" + APP_VER);
            return;
          }
        }

        // 4. Early Top-Level Error Trapping for stale chunks and HTML 404 responses
        function triggerHardRecovery(source) {
          var key = "tai_recov_" + APP_VER;
          var count = 0;
          try { count = parseInt(sessionStorage.getItem(key) || "0", 10); } catch(e) {}
          if (count < 2) {
            try { sessionStorage.setItem(key, String(count + 1)); } catch(e) {}
            if ("caches" in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              }).finally(function() {
                var sep = window.location.search ? "&" : "?";
                window.location.replace(window.location.pathname + window.location.search + sep + "_bust=" + Date.now());
              });
            } else {
              var sep = window.location.search ? "&" : "?";
              window.location.replace(window.location.pathname + window.location.search + sep + "_bust=" + Date.now());
            }
          }
        }

        window.addEventListener("vite:preloadError", function(e) {
          console.warn("Vite preload error, recovering...", e);
          triggerHardRecovery("preloadError");
        });

        window.addEventListener("error", function(e) {
          var msg = (e.message || (e.error && e.error.message) || "").toLowerCase();
          if (
            msg.indexOf("dynamically imported module") !== -1 ||
            msg.indexOf("unexpected token '<'") !== -1 ||
            msg.indexOf("loading chunk") !== -1 ||
            msg.indexOf("failed to fetch") !== -1 ||
            msg.indexOf("mime type") !== -1
          ) {
            triggerHardRecovery("syntaxOrChunkError");
          }
        });

        window.addEventListener("unhandledrejection", function(e) {
          var reason = (e.reason && (e.reason.message || e.reason)) ? String(e.reason.message || e.reason).toLowerCase() : "";
          if (
            reason.indexOf("dynamically imported module") !== -1 ||
            reason.indexOf("unexpected token '<'") !== -1 ||
            reason.indexOf("loading chunk") !== -1 ||
            reason.indexOf("failed to fetch") !== -1 ||
            reason.indexOf("mime type") !== -1
          ) {
            triggerHardRecovery("unhandledRejection");
          }
        });

        // 5. Register SW without controllerchange reload to prevent WebKit abort
        if ("serviceWorker" in navigator) {
          if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
            navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" })
              .then(function(reg) {
                reg.update().catch(function() {});
                reg.addEventListener("updatefound", function() {
                  var inst = reg.installing;
                  if (inst) {
                    inst.addEventListener("statechange", function() {
                      if (inst.state === "installed" && navigator.serviceWorker.controller) {
                        inst.postMessage({ type: "SKIP_WAITING" });
                      }
                    });
                  }
                });
              })
              .catch(function() {});
          }
        }
      })();
    </script>

      "@context": "https://schema.org",

  </head>
  <body>
    <div id="root">
      <div id="tai-initial-loader" style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F8FAFC; color: #64748B; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;">
        <img src="/train-ai-logo.png" alt="Train AI" style="height: 44px; width: auto; object-fit: contain; margin-bottom: 24px;" />
        <div style="width: 140px; height: 4px; border-radius: 99px; background: #E2E8F0; overflow: hidden; position: relative; margin-bottom: 16px;">
          <div style="position: absolute; top: 0; left: 0; width: 60%; height: 100%; background: #2563EB; border-radius: 99px;"></div>
        </div>
        <div id="tai-slow-load-helper" style="display: none; margin-top: 16px;">
          <p style="font-size: 13.5px; color: #64748B; margin: 0 0 12px; font-weight: 500;">Taking longer than expected?</p>
          <button onclick="window.__tai_clear_cache_and_reload()" style="background: #2563EB; color: #FFFFFF; border: none; padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(37,99,235,0.25);">
            Tap to Refresh
          </button>
        </div>
      </div>
    </div>
    <script>
      window.__tai_clear_cache_and_reload = function() {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var r of regs) { r.unregister(); }
            });
          }
          if ("caches" in window) {
            caches.keys().then(function(names) {
              for (var n of names) { caches.delete(n); }
            });
          }
          sessionStorage.clear();
        } catch (e) {}
        window.location.replace(window.location.pathname + "?_bust=" + Date.now());
      };

      setTimeout(function() {
        var helper = document.getElementById("tai-slow-load-helper");
        if (helper && document.getElementById("tai-initial-loader")) {
          helper.style.display = "block";
        }
      }, 3500);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
